<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragraphs</title>
</head>
<body>
    <h1>Paragraphs and Line Breaks</h1>
    <hr>
        <p>
           The sun rises when the moon sets <br> This is how our universe works
        </p>

    <hr>

        <p>
            You can create paragraphs in any way. Just put your text between &lt;p&gt; and &lt;/p&gt;
            If you need to break the line in an specific way, you can use a tag br "&lt;br&gt;"
        </p>
</body>
</html>


<!-- 
You can create paragraphs in any way. Just put your text between p and /p
If you need to break the line in an specific way, you can use a tag br "<br>"
-->
